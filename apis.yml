apis:
- name: Masterworks GraphQL API
  description: >-
    The single GraphQL endpoint behind the Masterworks web and mobile apps, covering art offerings,
    artists, auction and repeat-sale data, contributions, agreements and e-signature, KYC and
    accreditation, payments and payouts, the secondary-market exchange, art events, activity feeds,
    referrals and internal notification tooling. It is an undocumented first-party backend, not a
    published developer API: anonymous schema introspection is enabled, but every data field is
    guarded by an @authenticate directive and returns HTTP 200 with an
    errors[].extensions.code of invalidAuthentication (status 401) when called without a token.
  humanURL: https://www.masterworks.com/
  baseURL: https://api.masterworks.com/graphql
