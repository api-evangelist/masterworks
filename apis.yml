aid: masterworks
name: Masterworks
description: >-
  Masterworks is a New York fintech platform that securitizes blue-chip contemporary art. Founded in
  2017 and headquartered at 1 World Trade Center, it acquires paintings by artists such as Picasso,
  Basquiat, Warhol, Monet and Banksy, places each work in its own LLC, files it with the SEC as a
  separate Regulation A offering, and sells fractional shares to retail investors — who can also
  trade those shares with each other on a Masterworks-operated secondary market. The company runs a
  consumer web app, iOS/Android apps and an "Academy" education site, all backed by a single
  GraphQL endpoint at api.masterworks.com/graphql. Masterworks publishes no developer program,
  no OpenAPI, no API documentation and no SDKs: the GraphQL endpoint is the private backend for its
  own clients. It does, however, answer anonymous schema introspection, so the full machine-readable
  contract — 516 queries, 621 mutations, 5 subscriptions and 1,584 types — is publicly readable
  even though every data operation returns 401 invalidAuthentication without a user token.
