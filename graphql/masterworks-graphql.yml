summary: >-
  Masterworks operates a single GraphQL endpoint at https://api.masterworks.com/graphql. It is the
  private backend for the Masterworks web app, iOS/Android apps and Academy site — there is no
  developer program, no published documentation, no OpenAPI and no SDKs. Anonymous schema
  introspection is enabled, so the complete machine-readable contract can be read by anyone; every
  data field, however, is guarded by an @authenticate directive and returns
  errors[].extensions.code = invalidAuthentication (status 401) without a user token.

endpoint:
  url: https://api.masterworks.com/graphql
  methods: [POST]
  transport: http
  content_type: application/json
  csrf_protection: >-
    Apollo Server CSRF prevention is enabled — a request with no Content-Type (or with
    application/x-www-form-urlencoded, multipart/form-data, text/plain) is rejected 400 BAD_REQUEST
    unless it carries x-apollo-operation-name or apollo-require-preflight.
  server: Apollo Server (inferred from CSRF error text, @cacheControl and @joinMonster directives)

introspection:
  enabled: true
  anonymous: true
  observed: '2026-08-04'
  http_status: 200
  note: >-
    Anonymous introspection on a production, undocumented backend is a posture choice worth flagging
    to the provider. It is what makes this profile possible; it is also what lets anyone enumerate
    the full admin surface. Nothing here defeated an access control — the endpoint answered the
    standard __schema query with no credentials.

